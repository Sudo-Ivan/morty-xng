name: Fuzz

on:
  push:
    branches: [master, main]
    paths:
      - '**.go'
  pull_request:
    paths:
      - '**.go'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzSanitizeHTML, pkg: . }
          - { target: FuzzSanitizeCSS, pkg: . }
          - { target: FuzzSanitizeURI, pkg: . }
          - { target: FuzzProxifyURI, pkg: . }
          - { target: FuzzProxifySrcSet, pkg: . }
          - { target: FuzzVerifySignedURI, pkg: . }
          - { target: FuzzParseContentType, pkg: ./contenttype }
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_PKG: ${{ matrix.pkg }}
        run: go test -fuzz="$FUZZ_TARGET" -fuzztime=120s -count=1 "$FUZZ_PKG"
