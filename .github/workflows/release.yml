name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # needed to create the GitHub release and upload assets
      attestations: write # needed for build provenance attestation
      id-token: write # needed for attestation signing
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # cache disabled: release artifacts must not come from a
          # poisonable cache
          cache: false

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 freebsd/amd64 windows/amd64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            out="dist/morty-${tag}-${goos}-${goarch}"
            [ "$goos" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -buildid=" -o "$out" .
          done
          cd dist
          sha256sum -- * > "morty-${tag}-sha256sums.txt"

      - name: Attest binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/morty-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
